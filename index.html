<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenUtility — Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #080d12;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient background lighting effect */
        .glow-bg-1 {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(8, 13, 18, 0) 70%);
            top: 25%;
            left: 35%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .glow-bg-2 {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(8, 13, 18, 0) 70%);
            top: 65%;
            left: 65%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2.5rem 1.5rem;
            max-width: 850px;
            width: 100%;
            margin: auto;
        }

        /* OpenUtility Logo & Brand Header */
        .brand-header {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            padding: 0.5rem 1.25rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 50px;
            backdrop-filter: blur(8px);
        }

        .brand-logo {
            width: 28px;
            height: 28px;
            color: #10b981;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .brand-title span {
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        h1 span {
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            font-size: clamp(1rem, 2vw, 1.15rem);
            margin-bottom: 3rem;
            font-weight: 300;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Countdown Grid */
        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.25rem;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .time-box {
            background: #0f172a;
            border: 1px solid #1e293b;
            position: relative;
            padding: 1.75rem 1rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* Top gradient accent line */
        .time-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #10b981, #3b82f6);
        }

        .time-box span {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 4vw, 3.25rem);
            font-weight: 700;
            color: #ffffff;
            display: block;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }

        .time-box label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #64748b;
            font-weight: 600;
        }

        /* Email Notification Form */
        .notify-form {
            display: flex;
            gap: 0.5rem;
            max-width: 480px;
            margin: 0 auto;
        }

        .notify-form input {
            flex: 1;
            padding: 0.9rem 1.25rem;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .notify-form input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .notify-form button {
            padding: 0.9rem 1.8rem;
            background: linear-gradient(135deg, #10b981 0%, #2563eb 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.1s ease;
        }

        .notify-form button:hover {
            opacity: 0.9;
        }

        .notify-form button:active {
            transform: scale(0.98);
        }

        /* Footer Styles */
        footer {
            position: relative;
            z-index: 2;
            width: 100%;
            text-align: center;
            padding: 1.5rem;
            color: #64748b;
            font-size: 0.85rem;
            border-top: 1px solid rgba(30, 41, 59, 0.5);
            background: rgba(8, 13, 18, 0.8);
            backdrop-filter: blur(8px);
        }

        footer p {
            margin-bottom: 0;
            font-size: 0.85rem;
        }

        /* Mobile responsiveness */
        @media (max-width: 600px) {
            .countdown {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
            .notify-form {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="glow-bg-1"></div>
    <div class="glow-bg-2"></div>

    <div class="container">
        
        <!-- OpenUtility Branding -->
        <div class="brand-header">
            <svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <div class="brand-title">Open<span>Utility</span></div>
        </div>

        <h1>Something Big Is <span>Coming</span></h1>
        <p>We are building powerful tools for your next web workflow. Get ready for launch.</p>

        <!-- Live Countdown Timer -->
        <div class="countdown" id="countdown">
            <div class="time-box">
                <span id="days">10</span>
                <label>Days</label>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <label>Hours</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>Minutes</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>Seconds</label>
            </div>
        </div>

        <!-- Notification Form -->
        <form class="notify-form" onsubmit="event.preventDefault(); alert('Thank you for subscribing! We will notify you at launch.');">
            <input type="email" placeholder="Enter your email address" required>
            <button type="submit">Get Notified</button>
        </form>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 OpenUtility. All rights reserved.</p>
    </footer>

    <script>
        // Check if a target countdown date already exists in localStorage
        let countDownDate = localStorage.getItem("openUtilityLaunchDate");

        if (!countDownDate) {
            // If not, set it to 10 days from the current moment and save it
            countDownDate = new Date().getTime() + (10 * 24 * 60 * 60 * 1000);
            localStorage.setItem("openUtilityLaunchDate", countDownDate);
        } else {
            countDownDate = parseInt(countDownDate, 10);
        }

        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;

            // Calculations for Days, Hours, Minutes, and Seconds
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Display formatted numbers
            document.getElementById("days").innerText = String(Math.max(0, days)).padStart(2, '0');
            document.getElementById("hours").innerText = String(Math.max(0, hours)).padStart(2, '0');
            document.getElementById("minutes").innerText = String(Math.max(0, minutes)).padStart(2, '0');
            document.getElementById("seconds").innerText = String(Math.max(0, seconds)).padStart(2, '0');

            // Expiry state
            if (distance < 0) {
                clearInterval(x);
                document.getElementById("countdown").innerHTML = "<h2 style='grid-column: span 4; color: #10b981; font-family: Orbitron, sans-serif;'>OPENUTILITY IS NOW LIVE!</h2>";
            }
        }, 1000);
    </script>
</body>
</html>
