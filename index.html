<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Background glow effect */
        .glow-bg {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(220, 20, 60, 0.2) 0%, rgba(11, 11, 11, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(220, 20, 60, 0.5);
        }

        h1 span {
            color: #dc143c;
        }

        p {
            color: #a0a0a0;
            font-size: clamp(1rem, 2vw, 1.2rem);
            margin-bottom: 3rem;
            font-weight: 300;
        }

        /* Countdown Timer Styling */
        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .time-box {
            background: #141414;
            border: 1px solid #222;
            border-top: 3px solid #dc143c;
            padding: 1.5rem 1rem;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .time-box span {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 700;
            color: #ffffff;
            display: block;
            margin-bottom: 0.5rem;
        }

        .time-box label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #777;
            font-weight: 600;
        }

        /* Notify Form */
        .notify-form {
            display: flex;
            gap: 0.5rem;
            max-width: 450px;
            margin: 0 auto;
        }

        .notify-form input {
            flex: 1;
            padding: 0.9rem 1.2rem;
            background: #141414;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .notify-form input:focus {
            border-color: #dc143c;
        }

        .notify-form button {
            padding: 0.9rem 1.8rem;
            background: #dc143c;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
        }

        .notify-form button:hover {
            background: #b01030;
        }

        .notify-form button:active {
            transform: scale(0.98);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .countdown {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
            .notify-form {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="container">
        <h1>Coming <span>Soon</span></h1>
        <p>We are crafting something extraordinary. Stay tuned for the grand reveal.</p>

        <!-- Countdown Timer -->
        <div class="countdown" id="countdown">
            <div class="time-box">
                <span id="days">10</span>
                <label>Days</label>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <label>Hours</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>Minutes</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>Seconds</label>
            </div>
        </div>

        <!-- Email Notify Form -->
        <form class="notify-form" onsubmit="event.preventDefault(); alert('Thank you! You will be notified when we launch.');">
            <input type="email" placeholder="Enter your email address" required>
            <button type="submit">Notify Me</button>
        </form>
    </div>

    <script>
        // Set the countdown target to exactly 10 days from right now
        const countDownDate = new Date().getTime() + (10 * 24 * 60 * 60 * 1000);

        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;

            // Time calculations for days, hours, minutes and seconds
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Output the results in the respective elements
            document.getElementById("days").innerHTML = String(days).padStart(2, '0');
            document.getElementById("hours").innerHTML = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerHTML = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerHTML = String(seconds).padStart(2, '0');

            // If the countdown is finished, write some text
            if (distance < 0) {
                clearInterval(x);
                document.getElementById("countdown").innerHTML = "<h2 style='grid-column: span 4; color: #dc143c; font-family: Orbitron, sans-serif;'>WE ARE LIVE!</h2>";
            }
        }, 1000);
    </script>
</body>
</html>
